# Jamot — Render Blueprint
# Deploys the API, the Next.js web app, a scheduler worker, Postgres and Redis.
# Validation: render blueprints validate
#
# NOTE: The temporal knowledge graph (Graphiti MCP server + FalkorDB, see
# docker-compose.yml) is NOT provisioned here. It is not viable on the Render
# free tier: it must run where the jamot-api service can reach it over HTTP and
# needs OPENAI_API_KEY (per-episode LLM extraction). To enable in production,
# run graphiti-mcp on a paid service / private network and set GRAPHITI_ENABLED
# and GRAPHITI_MCP_URL on the jamot-api service below.

# NOTE: `corepack enable` is deliberately NOT used. Render's Node image ships
# pnpm at /usr/bin/pnpm on a read-only filesystem, so corepack fails the build
# with `EROFS: read-only file system, unlink '/usr/bin/pnpm'`. The live
# jamot-api/web/scheduler/channels services already run without it; this file
# had drifted and still carried it, which broke the first jamot-console build.
#
projects:
  - name: jamot
    environments:
      - name: production
        previews:
          generation: on
        databases:
          # Was "jamot-db" (basic_256mb, oregon) — that instance is suspended
          # and unused. The live jamot-api/scheduler/channels services had
          # DATABASE_URL unset in production (confirmed from jamot-api's own
          # logs: "[migrate] DATABASE_URL unset — skipping migrations" on
          # 2026-09-13/14/15), meaning this blueprint's database wiring had
          # drifted from what's actually running. jamot-ts-db is the database
          # actually in use; every fromDatabase reference below now points
          # at it. jamot-db should be deleted from the Render dashboard once
          # this is confirmed working — no tool here can delete it.
          - name: jamot-ts-db
            plan: basic_256mb
            region: oregon

        services:
          - type: web
            name: jamot-api
            runtime: node
            region: oregon
            plan: starter
            buildCommand: pnpm install --frozen-lockfile && pnpm --filter @jamot/api build
            # Matches the live jamot-api service, which the blueprint had not recorded.
            preDeployCommand: pnpm --filter @jamot/core exec tsx scripts/migrate.ts
            startCommand: pnpm --filter @jamot/api exec tsx src/index.ts
            healthCheckPath: /health
            buildFilter:
              paths:
                - packages/api/**
                - packages/core/**
                - packages/contracts/**
                - packages/sdk/**
                - package.json
                - pnpm-lock.yaml
                - pnpm-workspace.yaml
            disk:
              name: wa-session
              mountPath: /data
              sizeGB: 1
            envVars:
              - key: DATABASE_URL
                fromDatabase:
                  name: jamot-ts-db
                  property: connectionString
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: jamot-redis
                  property: connectionString
              - key: SESSION_SECRET
                generateValue: true
              - key: SECRET_ENCRYPTION_KEY
                generateValue: true
              # Share the session cookie across all jamot.pro subdomains so the
              # web app's server-side routes (CopilotKit chat) can forward the
              # user's session to the API.
              - key: COOKIE_DOMAIN
                value: .jamot.pro
              - key: CORS_ORIGIN
                value: https://mvp.jamot.pro
              - key: FRONTEND_URL
                value: https://mvp.jamot.pro
              - key: GOOGLE_CLIENT_ID
                sync: false
              - key: GOOGLE_CLIENT_SECRET
                sync: false
              - key: GOOGLE_REDIRECT_URI
                value: https://api.jamot.pro/api/auth/google/callback
              - key: GOOGLE_CONNECTOR_REDIRECT_URI
                value: https://api.jamot.pro/api/google/callback
              - key: WA_WORKER_URL
                value: ""
              - key: WHATSAPP_SESSION_DIR
                value: /data/whatsapp
              - key: WHATSAPP_PROXY_URL
                value: ""
              # Self-hosted org logo uploads (served from /uploads/*). Reuses the
              # wa-session disk mounted at /data.
              - key: UPLOADS_DIR
                value: /data/uploads
              - key: NODE_ENV
                value: production
              # Grant-only super admins; comma-separated emails. Leave empty unless you
              # want to grant full platform super-admin access to specific accounts.
              - key: SUPER_ADMIN_EMAILS
                value: ""
              # google-maps-worker isn't functional yet (see its service block
              # below) — left blank so the provider reports "not configured"
              # instead of pointing at a worker that cannot search anything.
              # Once the scraper is vendored, set this to the worker's internal
              # address and set MAPS_WORKER_INTERNAL_TOKEN here to the same
              # value generated on the jamot-google-maps-worker service.
              - key: MAPS_WORKER_URL
                value: ""
              - key: MAPS_WORKER_INTERNAL_TOKEN
                sync: false

          - type: web
            name: jamot-web
            runtime: node
            region: oregon
            plan: starter
            buildCommand: pnpm install --frozen-lockfile && pnpm --filter @jamot/web build
            startCommand: pnpm --filter @jamot/web start
            buildFilter:
              paths:
                - apps/web/**
                - packages/client/**
                - packages/contracts/**
                - package.json
                - pnpm-lock.yaml
                - pnpm-workspace.yaml
            envVars:
              # Next_PUBLIC_ values must be concrete strings — they're compiled into client JS.
              - key: NEXT_PUBLIC_API_URL
                value: https://api.jamot.pro
              # Root domain used to detect per-org subdomains (e.g. org.jamot.pro).
              - key: NEXT_PUBLIC_ROOT_DOMAIN
                value: jamot.pro

          # Per-organization branded consoles. One service serves every org:
          # the org is resolved per request from the subdomain (src/proxy.ts),
          # so adding an org needs no deploy. Requires a wildcard custom domain
          # (*.jamot.pro) pointed at this service.
          - type: web
            name: jamot-console
            runtime: node
            region: oregon
            plan: starter
            buildCommand: pnpm install --frozen-lockfile && pnpm --filter @jamot/console build
            startCommand: pnpm --filter @jamot/console start
            buildFilter:
              paths:
                - apps/console/**
                - packages/client/**
                - package.json
                - pnpm-lock.yaml
                - pnpm-workspace.yaml
            envVars:
              - key: NEXT_PUBLIC_API_URL
                value: https://api.jamot.pro
              - key: NEXT_PUBLIC_ROOT_DOMAIN
                value: jamot.pro

          - type: worker
            name: jamot-scheduler
            runtime: node
            region: oregon
            plan: starter
            buildCommand: pnpm install --frozen-lockfile && pnpm --filter @jamot/workers build
            startCommand: pnpm --filter @jamot/workers exec tsx src/scheduler.ts
            buildFilter:
              paths:
                - packages/workers/**
                - packages/core/**
                - packages/contracts/**
                - package.json
                - pnpm-lock.yaml
                - pnpm-workspace.yaml
            envVars:
              - key: DATABASE_URL
                fromDatabase:
                  name: jamot-ts-db
                  property: connectionString
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: jamot-redis
                  property: connectionString

          # Isolated Google Maps discovery worker (services/google-maps-worker).
          # NOT functional yet: the vendored scraper
          # (services/google-maps-worker/src/provider/omkarcloud/VENDORED_COMMIT.md)
          # has not been checked in, so every job will fail at the search step.
          # This entry exists so the service builds and is reachable on Render's
          # private network once that's done — do not point Jamot Core's
          # MAPS_WORKER_URL at it in production before then.
          #
          # Before first use: apply services/google-maps-worker/src/db/schema.sql
          # against jamot-ts-db manually (no preDeployCommand here — this is a
          # Docker runtime with no psql/pnpm toolchain guaranteed available at
          # predeploy time, unlike the Node-runtime services above).
          - type: pserv
            name: jamot-google-maps-worker
            runtime: docker
            region: oregon
            plan: starter
            dockerfilePath: ./services/google-maps-worker/Dockerfile
            dockerContext: ./services/google-maps-worker
            buildFilter:
              paths:
                - services/google-maps-worker/**
            envVars:
              - key: DATABASE_URL
                fromDatabase:
                  name: jamot-ts-db
                  property: connectionString
              - key: MAPS_WORKER_ENABLED
                value: "true"
              - key: MAPS_WORKER_CONCURRENCY
                value: "2"
              - key: MAPS_JOB_TIMEOUT
                value: "1800"
              - key: MAPS_RETRY_COUNT
                value: "3"
              - key: MAPS_PROVIDER
                value: omkarcloud
              # Jamot Core authenticates to this worker with this token
              # (leads/google-maps-worker secret, or MAPS_WORKER_INTERNAL_TOKEN
              # env on jamot-api) — never expose it to a frontend client.
              - key: MAPS_WORKER_INTERNAL_TOKEN
                generateValue: true
              - key: PORT
                value: "8081"

          - type: keyvalue
            name: jamot-redis
            plan: starter
            maxmemoryPolicy: noeviction
            ipAllowList:
              - source: 0.0.0.0/0
                description: everywhere

          - type: worker
            name: jamot-channels
            runtime: node
            region: oregon
            plan: starter
            buildCommand: pnpm install --frozen-lockfile && pnpm --filter @jamot/workers build
            startCommand: pnpm --filter @jamot/workers exec tsx src/channel.ts
            buildFilter:
              paths:
                - packages/workers/**
                - packages/core/**
                - packages/contracts/**
                - package.json
                - pnpm-lock.yaml
                - pnpm-workspace.yaml
            envVars:
              - key: DATABASE_URL
                fromDatabase:
                  name: jamot-ts-db
                  property: connectionString
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: jamot-redis
                  property: connectionString
              # Telegram / Matrix are connected per-account from the channel_accounts
              # table (configured in-app). The env vars below are optional global
              # fallbacks. WHATSAPP_SESSION_DIR is intentionally empty here so the
              # WhatsApp manager keeps running in-process on jamot-api.
              - key: WHATSAPP_SESSION_DIR
                value: ""
              - key: TELEGRAM_API_URL
                value: ""
              - key: MATRIX_HOMESERVER_URL
                value: ""
              - key: NODE_ENV
                value: production
