# Jamot — Render Blueprint
# Deploys the API, the unified Next.js console app (jamot-console — org-skinned
# marketing/console page plus the full product UI, formerly split across
# jamot-web and jamot-console), a scheduler worker, Postgres and Redis.
# Validation: render blueprints validate
#
# The temporal knowledge graph (Graphiti MCP server + FalkorDB, mirrored from
# docker-compose.yml) IS provisioned here as two private services
# (jamot-falkordb, jamot-graphiti) reachable only from other services in this
# project over Render's private network — not billed for public bandwidth,
# not exposed publicly. jamot-api and jamot-channels point GRAPHITI_MCP_URL at
# jamot-graphiti's internal hostname and have GRAPHITI_ENABLED=true. You still
# must set OPENAI_API_KEY on jamot-graphiti (per-episode LLM extraction) in
# the Render dashboard — it is deliberately `sync: false` here, never checked
# in. Flip GRAPHITI_ENABLED to false on jamot-api/jamot-channels to disable
# the mirror without removing the services.

# NOTE: `corepack enable` is deliberately NOT used. Render's Node image ships
# pnpm at /usr/bin/pnpm on a read-only filesystem, so corepack fails the build
# with `EROFS: read-only file system, unlink '/usr/bin/pnpm'`. The live
# jamot-api/web/scheduler/channels services already run without it; this file
# had drifted and still carried it, which broke the first jamot-console build.
#
projects:
  - name: jamot
    environments:
      - name: production
        previews:
          generation: on
        databases:
          # Was "jamot-db" (basic_256mb, oregon) — that instance is suspended
          # and unused. The live jamot-api/scheduler/channels services had
          # DATABASE_URL unset in production (confirmed from jamot-api's own
          # logs: "[migrate] DATABASE_URL unset — skipping migrations" on
          # 2026-09-13/14/15), meaning this blueprint's database wiring had
          # drifted from what's actually running. jamot-ts-db is the database
          # actually in use; every fromDatabase reference below now points
          # at it. jamot-db should be deleted from the Render dashboard once
          # this is confirmed working — no tool here can delete it.
          - name: jamot-ts-db
            plan: basic_256mb
            region: oregon

        services:
          - type: web
            name: jamot-api
            runtime: node
            region: oregon
            plan: starter
            buildCommand: pnpm install --frozen-lockfile && pnpm --filter @jamot/api build
            # Matches the live jamot-api service, which the blueprint had not recorded.
            preDeployCommand: pnpm --filter @jamot/core exec tsx scripts/migrate.ts
            startCommand: pnpm --filter @jamot/api exec tsx src/index.ts
            healthCheckPath: /health
            buildFilter:
              paths:
                - packages/api/**
                - packages/core/**
                - packages/contracts/**
                - packages/sdk/**
                - package.json
                - pnpm-lock.yaml
                - pnpm-workspace.yaml
            disk:
              name: wa-session
              mountPath: /data
              sizeGB: 1
            envVars:
              - key: DATABASE_URL
                fromDatabase:
                  name: jamot-ts-db
                  property: connectionString
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: jamot-redis
                  property: connectionString
              - key: SESSION_SECRET
                generateValue: true
              - key: SECRET_ENCRYPTION_KEY
                generateValue: true
              # Share the session cookie across all jamot.pro subdomains so
              # jamot-console's server-side routes (CopilotKit chat) can forward
              # the user's session to the API. mvp.jamot.pro is retired; only
              # its root domain matters here (buildCorsOrigin/safeReturnUrl
              # derive the jamot.pro wildcard from it), so any live
              # <org>.jamot.pro value works — sales.jamot.pro is the current one.
              - key: COOKIE_DOMAIN
                value: .jamot.pro
              - key: CORS_ORIGIN
                value: https://sales.jamot.pro
              - key: FRONTEND_URL
                value: https://sales.jamot.pro
              - key: GOOGLE_CLIENT_ID
                sync: false
              - key: GOOGLE_CLIENT_SECRET
                sync: false
              - key: GOOGLE_REDIRECT_URI
                value: https://api.jamot.pro/api/auth/google/callback
              - key: GOOGLE_CONNECTOR_REDIRECT_URI
                value: https://api.jamot.pro/api/google/callback
              - key: WA_WORKER_URL
                value: ""
              - key: WHATSAPP_SESSION_DIR
                value: /data/whatsapp
              - key: WHATSAPP_PROXY_URL
                value: ""
              # Self-hosted org logo uploads (served from /uploads/*). Reuses the
              # wa-session disk mounted at /data.
              - key: UPLOADS_DIR
                value: /data/uploads
              - key: NODE_ENV
                value: production
              # Grant-only super admins; comma-separated emails. Leave empty unless you
              # want to grant full platform super-admin access to specific accounts.
              - key: SUPER_ADMIN_EMAILS
                value: ""
              # Temporal knowledge-graph mirror (see jamot-graphiti/jamot-falkordb
              # below). Soft-failing: if the mirror is unreachable, Postgres
              # (the primary) is unaffected.
              - key: GRAPHITI_ENABLED
                value: "true"
              # Private services resolve by name on Render's internal network;
              # jamot-graphiti listens on 8000 (see the service below).
              - key: GRAPHITI_MCP_URL
                value: http://jamot-graphiti:8000/mcp/

          # apps/web (jamot-web) was retired: its routes/components were merged
          # into apps/console (see apps/console/src/app/(app)/**), so jamot-console
          # is now the single app serving both the per-org marketing/console page
          # (subdomain-branded "skin") and the full product UI. Point mvp.jamot.pro
          # at jamot-console in the Render dashboard (custom domains aren't managed
          # in this file) instead of a separate jamot-web service.

          # Per-organization branded consoles. One service serves every org:
          # the org is resolved per request from the subdomain (src/proxy.ts),
          # so adding an org needs no deploy. Requires a wildcard custom domain
          # (*.jamot.pro) pointed at this service.
          - type: web
            name: jamot-console
            runtime: node
            region: oregon
            plan: starter
            buildCommand: pnpm install --frozen-lockfile && pnpm --filter @jamot/console build
            startCommand: pnpm --filter @jamot/console start
            buildFilter:
              paths:
                - apps/console/**
                - packages/client/**
                - packages/contracts/**
                - packages/archetype-engine/**
                - packages/canvas-lead-generation/**
                - package.json
                - pnpm-lock.yaml
                - pnpm-workspace.yaml
            envVars:
              - key: NEXT_PUBLIC_API_URL
                value: https://api.jamot.pro
              - key: NEXT_PUBLIC_ROOT_DOMAIN
                value: jamot.pro

          - type: worker
            name: jamot-scheduler
            runtime: node
            region: oregon
            plan: starter
            buildCommand: pnpm install --frozen-lockfile && pnpm --filter @jamot/workers build
            startCommand: pnpm --filter @jamot/workers exec tsx src/scheduler.ts
            buildFilter:
              paths:
                - packages/workers/**
                - packages/core/**
                - packages/contracts/**
                - package.json
                - pnpm-lock.yaml
                - pnpm-workspace.yaml
            envVars:
              - key: DATABASE_URL
                fromDatabase:
                  name: jamot-ts-db
                  property: connectionString
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: jamot-redis
                  property: connectionString

          - type: keyvalue
            name: jamot-redis
            plan: starter
            maxmemoryPolicy: noeviction
            ipAllowList:
              - source: 0.0.0.0/0
                description: everywhere

          - type: worker
            name: jamot-channels
            runtime: node
            region: oregon
            plan: starter
            buildCommand: pnpm install --frozen-lockfile && pnpm --filter @jamot/workers build
            startCommand: pnpm --filter @jamot/workers exec tsx src/channel.ts
            buildFilter:
              paths:
                - packages/workers/**
                - packages/core/**
                - packages/contracts/**
                - package.json
                - pnpm-lock.yaml
                - pnpm-workspace.yaml
            envVars:
              - key: DATABASE_URL
                fromDatabase:
                  name: jamot-ts-db
                  property: connectionString
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: jamot-redis
                  property: connectionString
              # Telegram / Matrix are connected per-account from the channel_accounts
              # table (configured in-app). The env vars below are optional global
              # fallbacks. WHATSAPP_SESSION_DIR is intentionally empty here so the
              # WhatsApp manager keeps running in-process on jamot-api.
              - key: WHATSAPP_SESSION_DIR
                value: ""
              - key: TELEGRAM_API_URL
                value: ""
              - key: MATRIX_HOMESERVER_URL
                value: ""
              - key: NODE_ENV
                value: production
              # Same temporal knowledge-graph mirror as jamot-api — Telegram/
              # Matrix interactions handled by this worker should land in the
              # same person memory.
              - key: GRAPHITI_ENABLED
                value: "true"
              - key: GRAPHITI_MCP_URL
                value: http://jamot-graphiti:8000/mcp/

          # FalkorDB: Graphiti's graph store. Private only — never exposed
          # publicly, reachable from jamot-graphiti over Render's internal
          # network at redis://jamot-falkordb:6379 (mirrors docker-compose.yml).
          - type: pserv
            name: jamot-falkordb
            runtime: image
            region: oregon
            plan: starter
            image:
              url: docker.io/falkordb/falkordb:latest
            envVars:
              - key: FALKORDB_PASSWORD
                value: ""
              - key: BROWSER
                value: "0"
            disk:
              name: falkordb-data
              mountPath: /var/lib/falkordb/data
              sizeGB: 1

          # Graphiti MCP server: receives the dual-write mirror of person
          # memories from jamot-api/jamot-channels and projects them into
          # FalkorDB as a temporal knowledge graph. Private only.
          - type: pserv
            name: jamot-graphiti
            runtime: image
            region: oregon
            plan: starter
            image:
              url: docker.io/zepai/knowledge-graph-mcp:standalone
            envVars:
              - key: FALKORDB_URI
                value: redis://jamot-falkordb:6379
              # Required for episode extraction — set in the Render dashboard,
              # never checked in.
              - key: OPENAI_API_KEY
                sync: false
              - key: OPENAI_API_URL
                value: https://api.openai.com/v1
              - key: GRAPHITI_GROUP_ID
                value: main
              - key: GRAPHITI_TELEMETRY_ENABLED
                value: "false"
              - key: SEMAPHORE_LIMIT
                value: "2"
